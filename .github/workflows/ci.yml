name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pnpm
        # v6.1.1
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d

      - name: Set up Node.js
        # v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Knip
        run: pnpm run knip

      - name: Unit tests
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://aizhida.example.com
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify the production URL is required
        run: |
          if NEXT_PUBLIC_SITE_URL= pnpm run build > /tmp/missing-url.log 2>&1; then
            echo "Expected the build to fail without NEXT_PUBLIC_SITE_URL"
            exit 1
          fi
          grep -q "NEXT_PUBLIC_SITE_URL" /tmp/missing-url.log

  e2e:
    name: e2e
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pnpm
        # v6.1.1
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d

      - name: Set up Node.js
        # v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://aizhida.example.com
          NEXT_TELEMETRY_DISABLED: "1"

      - name: End-to-end tests
        run: pnpm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # 生产构建已完成，webServer 只负责启动，避免二次构建。
          PLAYWRIGHT_SKIP_BUILD: "1"

      - name: Upload report
        if: failure()
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Check PR title follows Conventional Commits
        # v6.1.2
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
