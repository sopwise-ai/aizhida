name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Knip
        run: pnpm run knip

      - name: Unit tests
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://aizhida.example.com
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify the production URL is required
        run: |
          if NEXT_PUBLIC_SITE_URL= pnpm run build > /tmp/missing-url.log 2>&1; then
            echo "Expected the build to fail without NEXT_PUBLIC_SITE_URL"
            exit 1
          fi
          grep -q "NEXT_PUBLIC_SITE_URL" /tmp/missing-url.log

  e2e:
    name: e2e
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://aizhida.example.com
          NEXT_TELEMETRY_DISABLED: "1"

      - name: End-to-end tests
        run: pnpm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
